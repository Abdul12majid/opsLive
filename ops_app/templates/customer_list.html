<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsLive — Customers</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script>
    (function() {
      var t = 'light';
      try { t = localStorage.getItem('theme') || 'light'; } catch(e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <main class="page">

      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search by name, phone, email or ID..." oninput="filterCustomers()">
        </div>
        <div class="chip-list" style="margin-left:auto">
          <button class="chip active" data-filter="all" onclick="setFilter('all')">All</button>
          <button class="chip" data-filter="ahs" onclick="setFilter('ahs')">AHS</button>
          <button class="chip" data-filter="recent" onclick="setFilter('recent')">Recent (7d)</button>
          <button class="chip" data-filter="unpaid" onclick="setFilter('unpaid')">Unpaid</button>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openNewCustomerModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Customer
        </button>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Total Customers</div>
          <div class="stat-value">3,868</div>
          <div class="stat-sub">+20 this week</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active This Month</div>
          <div class="stat-value" style="color:var(--accent)">412</div>
          <div class="stat-sub"><span class="stat-trend up">&#8599; 8%</span> vs last month</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">AHS Contracts</div>
          <div class="stat-value" style="color:var(--purple)">1,204</div>
          <div class="stat-sub">31% of total</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Outstanding Balance</div>
          <div class="stat-value" style="color:var(--red)">$2,340</div>
          <div class="stat-sub">17 customers</div>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="card-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          <span class="card-title">Customer List</span>
          <span style="font-size:12px;color:var(--text-muted)" id="result-count">20 results</span>
          <button class="btn btn-outline btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export
          </button>
        </div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Created</th>
                <th>Jobs</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="customers-tbody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <div class="pagination-info">Showing <strong id="page-start">1</strong>–<strong id="page-end">20</strong> of <strong>3,868</strong></div>
          <div class="pagination-controls">
            <button class="page-btn" disabled>&#8249;</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">4</button>
            <button class="page-btn">&#8250;</button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- New Customer Modal -->
<div class="modal-overlay" id="new-customer-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">New Customer</span>
      <button class="modal-close" onclick="closeModal('new-customer-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="info-grid">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input class="form-control" placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input class="form-control" placeholder="(702) 555-0100">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-control" placeholder="jane@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input class="form-control" placeholder="123 Main St, Las Vegas, NV">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-control" placeholder="Optional notes..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('new-customer-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="closeModal('new-customer-modal');showToast('Customer created','success')">Create Customer</button>
    </div>
  </div>
</div>

<script src="{% static 'js/app.js' %}"></script>
<script>
  document.getElementById('sidebar-mount').innerHTML = buildSidebar('customer_list.html');
  document.getElementById('topbar-mount').innerHTML  = buildTopbar('Customers', '/ 3,868 total');

  let currentFilter = 'all';

  function renderCustomers() {
    const q = document.getElementById('search-input').value.toLowerCase().trim();
    let list = CUSTOMERS.filter(c => {
      if (q && !(`${c.name} ${c.phone} ${c.email} ${c.id}`.toLowerCase().includes(q))) return false;
      if (currentFilter === 'ahs' && c.id % 3 !== 0) return false;
      if (currentFilter === 'unpaid' && c.id % 5 !== 0) return false;
      if (currentFilter === 'recent' && c.id < 3855) return false;
      return true;
    });

    const tbody = document.getElementById('customers-tbody');
    tbody.innerHTML = list.map(c => `
      <tr>
        <td class="td-muted">#${c.id}</td>
        <td><a href="customer_details.html?id=${c.id}" class="td-link">${c.name}</a></td>
        <td>${c.phone}</td>
        <td class="td-muted">${c.email}</td>
        <td class="td-muted">${c.date}</td>
        <td>${Math.floor(Math.random()*5)+1}</td>
        <td>${c.id % 4 === 0 ? '<span class="badge badge-unpaid">UNPAID</span>' : '<span class="badge badge-active">ACTIVE</span>'}</td>
        <td style="text-align:right">
          <button class="btn btn-ghost btn-sm btn-icon" title="View" onclick="location.href='customer_details.html?id=${c.id}'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </td>
      </tr>`).join('');

    document.getElementById('result-count').textContent = `${list.length} results`;
    document.getElementById('page-end').textContent = list.length;
  }

  function filterCustomers() { renderCustomers(); }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    renderCustomers();
  }

  function openNewCustomerModal() { document.getElementById('new-customer-modal').classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  document.getElementById('new-customer-modal').addEventListener('click', e => {
    if (e.target.id === 'new-customer-modal') closeModal('new-customer-modal');
  });

  renderCustomers();
</script>
</body>
</html>
